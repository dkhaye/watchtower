name: go.lint

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.mod
            justfile

      - name: Set up just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0

      - name: Lint Go code
        id: lint
        continue-on-error: true
        run: just lint

      - name: Upload lint findings to code scanning
        if: ${{ always() && hashFiles('.build/golangci-lint.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          category: golangci-lint
          sarif_file: .build/golangci-lint.sarif

      - name: Enforce lint result
        if: ${{ always() && steps.lint.outcome == 'failure' }}
        run: exit 1
