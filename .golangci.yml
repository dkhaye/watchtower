version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused

formatters:
  enable:
    - gofmt

output:
  formats:
    text:
      path: stdout
      colors: true
    sarif:
      path: .build/golangci-lint.sarif

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
